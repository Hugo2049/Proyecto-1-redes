[project]
name = "chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hb_W", email = "hugobarillasvi@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.4.0",
    "fastapi>=0.141.1",
    "python-dotenv>=1.2.3",
    "truststore>=0.10.4",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
chatbot = "chatbot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
system-certs = true
